<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save to Crumbs</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 64 64">
      <defs>
        <mask id="bite">
          <rect width="64" height="64" fill="#fff"/>
          <circle cx="50" cy="13" r="9" fill="#000"/>
          <circle cx="57" cy="25" r="6" fill="#000"/>
          <circle cx="40" cy="6" r="6" fill="#000"/>
        </mask>
      </defs>
      <circle fill="currentColor" cx="29" cy="33" r="24" mask="url(#bite)"/>
      <g style="fill: var(--bg)">
        <circle cx="20" cy="24" r="3.4"/><circle cx="33" cy="41" r="3.8"/><circle cx="18" cy="42" r="2.6"/>
        <circle cx="37" cy="26" r="2.5"/><circle cx="27" cy="33" r="1.9"/>
      </g>
      <g fill="currentColor">
        <rect x="52" y="39" width="5.5" height="5.5" rx="1.3" transform="rotate(22 54.75 41.75)"/>
        <rect x="56" y="50" width="4.2" height="4.2" rx="1" transform="rotate(-18 58.1 52.1)"/>
        <rect x="47.5" y="55" width="3.2" height="3.2" rx=".8" transform="rotate(35 49.1 56.6)"/>
      </g>
    </symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M14.5 4h-5L7.5 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.5z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
  </svg>

  <header class="top">
    <a class="brand" id="brand" href="#" title="Open Crumbs">
      <svg class="logo" width="26" height="26"><use href="#i-logo"/></svg>
      <span>Crumbs</span>
    </a>
    <span class="who muted small" id="who"></span>
    <button class="icon-btn" id="settings" title="Settings" aria-label="Settings">
      <svg width="18" height="18"><use href="#i-gear"/></svg>
    </button>
  </header>

  <!-- Not connected yet -->
  <section class="empty-state" id="connect" hidden>
    <svg class="logo big" width="56" height="56"><use href="#i-logo"/></svg>
    <h2>Connect to your Crumbs</h2>
    <p class="muted" id="connect-msg">Tell the extension where your Crumbs bookmark manager lives, for example <b>http://raspberrypi.local:9099</b>.</p>
    <button class="btn primary" id="connect-btn">Open settings</button>
  </section>

  <!-- The form -->
  <form id="form" hidden autocomplete="off">
    <div class="banner" id="banner" hidden></div>

    <div class="thumb" id="thumb" tabindex="-1">
      <img id="thumb-img" alt="" hidden>
      <div class="thumb-empty" id="thumb-empty">
        <span class="muted small" id="thumb-status">Finding a preview…</span>
        <div class="thumb-actions" id="thumb-empty-actions" hidden>
          <button type="button" class="chip" id="t-find"><svg width="14" height="14"><use href="#i-sparkle"/></svg>Find preview</button>
          <button type="button" class="chip" id="t-shot2"><svg width="14" height="14"><use href="#i-camera"/></svg>Screenshot</button>
          <button type="button" class="chip" id="t-upload2"><svg width="14" height="14"><use href="#i-upload"/></svg>Upload</button>
        </div>
      </div>
      <div class="spinner" id="thumb-spin" hidden></div>
      <div class="thumb-bar" id="thumb-bar" hidden>
        <span class="thumb-count" id="thumb-count"></span>
        <span class="grow"></span>
        <button type="button" class="tb" id="t-prev" title="Previous image" aria-label="Previous image"><svg width="16" height="16"><use href="#i-left"/></svg></button>
        <button type="button" class="tb" id="t-next" title="Next image" aria-label="Next image"><svg width="16" height="16"><use href="#i-right"/></svg></button>
        <button type="button" class="tb" id="t-shot" title="Use a screenshot of the page" aria-label="Screenshot"><svg width="16" height="16"><use href="#i-camera"/></svg></button>
        <button type="button" class="tb" id="t-upload" title="Upload your own image (or paste one)" aria-label="Upload image"><svg width="16" height="16"><use href="#i-upload"/></svg></button>
        <button type="button" class="tb" id="t-remove" title="No thumbnail" aria-label="Remove thumbnail"><svg width="16" height="16"><use href="#i-x"/></svg></button>
      </div>
      <input type="file" id="t-file" accept="image/*" hidden>
    </div>

    <label class="field">
      <span class="label">Name</span>
      <span class="with-icon">
        <span class="fav-box" id="fav-box" title="Favicon"><img id="fav" alt="" hidden><span id="fav-letter"></span></span>
        <input id="name" maxlength="300" placeholder="Page title" required>
      </span>
    </label>

    <label class="field">
      <span class="label">URL</span>
      <input id="url" maxlength="4096" placeholder="https://" required spellcheck="false">
    </label>

    <div class="field">
      <label class="label" for="folder">Folder</label>
      <div class="row">
        <select id="folder"></select>
        <button type="button" class="icon-btn bordered" id="new-folder" title="New folder" aria-label="New folder">
          <svg width="16" height="16"><use href="#i-plus"/></svg>
        </button>
      </div>
      <div class="row" id="new-folder-row" hidden>
        <input id="new-folder-name" maxlength="100" placeholder="New folder name">
        <button type="button" class="btn small-btn" id="new-folder-ok">Create</button>
      </div>
    </div>

    <label class="field">
      <span class="label">Description
        <button type="button" class="link" id="desc-fill" hidden>Fill from page</button>
      </span>
      <textarea id="desc" rows="3" maxlength="2000" placeholder="A note for future you"></textarea>
    </label>

    <p class="error" id="error" role="alert" hidden></p>

    <footer class="actions">
      <button type="button" class="btn" id="open">
        <svg width="16" height="16"><use href="#i-open"/></svg>Open Crumbs
      </button>
      <button type="submit" class="btn primary" id="save">Save</button>
    </footer>
  </form>

  <!-- Saved -->
  <section class="empty-state" id="done" hidden>
    <span class="done-check"><svg width="30" height="30"><use href="#i-check"/></svg></span>
    <h2 id="done-title">Saved to Crumbs</h2>
    <p class="muted" id="done-msg"></p>
    <div class="row center">
      <button class="btn" id="done-open">Open Crumbs</button>
      <button class="btn primary" id="done-close">Done</button>
    </div>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
